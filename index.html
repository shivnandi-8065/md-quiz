<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MD Quiz</title>


<!-- Google Sign-In -->
<script
  src="https://accounts.google.com/gsi/client"
  async
  defer
></script>


<style>

:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --ink: #172033;
  --muted: #697386;
  --accent: #5b5cf0;
  --accent2: #7c3aed;
  --line: #e7eaf1;
  --bad: #d64545;
}


* {
  box-sizing: border-box;
}


body {
  margin: 0;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f7f8ff,
      #eef3ff
    );

  color: var(--ink);
}


.app {
  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 28px;
}


.shell {
  width: min(920px, 100%);

  background: rgba(255,255,255,.95);

  backdrop-filter: blur(18px);

  border: 1px solid rgba(255,255,255,.8);

  border-radius: 28px;

  box-shadow:
    0 24px 70px rgba(30,40,80,.13);

  overflow: hidden;
}


header {
  padding: 28px 34px 18px;

  border-bottom:
    1px solid var(--line);
}


.brand {
  font-weight: 800;

  letter-spacing: -.03em;

  font-size: 18px;
}


.progress {
  height: 6px;

  background: #edf0f7;

  border-radius: 99px;

  margin-top: 18px;

  overflow: hidden;
}


.bar {
  height: 100%;

  width: 0;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );

  transition: width .35s ease;
}


main {
  padding: 42px 48px 50px;
}


.screen {
  animation: enter .35s ease;
}


@keyframes enter {

  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: none;
  }

}


.eyebrow {
  font-size: 13px;

  font-weight: 700;

  color: var(--accent);

  text-transform: uppercase;

  letter-spacing: .12em;

  margin-bottom: 10px;
}


h1 {
  font-size:
    clamp(30px, 5vw, 52px);

  line-height: 1.02;

  letter-spacing: -.045em;

  margin: 0 0 14px;
}


h2 {
  font-size: 30px;

  letter-spacing: -.035em;

  margin: 0 0 10px;
}


p {
  color: var(--muted);

  line-height: 1.65;
}


label {
  display: block;

  font-size: 14px;

  font-weight: 700;

  margin: 20px 0 8px;
}


input {
  width: 100%;

  padding: 16px 18px;

  border:
    1px solid var(--line);

  border-radius: 14px;

  font-size: 16px;

  outline: none;

  background: #fff;
}


input:focus {
  border-color: #8b8cf5;

  box-shadow:
    0 0 0 4px rgba(91,92,240,.1);
}


.actions {
  display: flex;

  justify-content: space-between;

  gap: 12px;

  margin-top: 34px;
}


button {
  border: 0;

  border-radius: 13px;

  padding: 14px 20px;

  font-weight: 750;

  font-size: 15px;

  cursor: pointer;

  transition: .2s;
}


button:disabled {
  opacity: .5;

  cursor: not-allowed;
}


.primary {
  color: #fff;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 9px 24px rgba(91,92,240,.25);
}


.primary:hover {
  transform: translateY(-1px);
}


.secondary {
  background: #f1f3f8;

  color: #3d4658;
}


.categories {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 16px;

  margin-top: 28px;
}


.category {
  text-align: left;

  padding: 24px;

  border:
    1px solid var(--line);

  border-radius: 20px;

  background: #fff;

  cursor: pointer;

  min-height: 210px;

  transition: .25s;
}


.category:hover {
  transform: translateY(-4px);

  box-shadow:
    0 14px 35px rgba(40,50,100,.1);

  border-color: #c9caf9;
}


.icon {
  width: 52px;

  height: 52px;

  border-radius: 15px;

  display: grid;

  place-items: center;

  background: #f0f0ff;

  font-size: 25px;

  margin-bottom: 20px;
}


.category h3 {
  margin: 0 0 8px;

  font-size: 20px;
}


.category p {
  font-size: 14px;

  margin: 0;
}


.q-image {
  width: 100%;

  max-height: 300px;

  object-fit: cover;

  border-radius: 18px;

  margin: 18px 0;

  border:
    1px solid var(--line);
}


.options {
  display: grid;

  gap: 12px;

  margin-top: 22px;
}


.option {
  display: flex;

  align-items: center;

  gap: 13px;

  padding: 16px;

  border:
    1px solid var(--line);

  border-radius: 15px;

  background: #fff;

  cursor: pointer;

  transition: .2s;
}


.option:hover {
  border-color: #bfc0f7;

  background: #fafaff;
}


.option.selected {
  border-color: var(--accent);

  background: #f5f5ff;

  box-shadow:
    0 0 0 2px rgba(91,92,240,.08);
}


.radio {
  width: 19px;

  height: 19px;

  border:
    2px solid #b6bbc8;

  border-radius: 50%;

  display: grid;

  place-items: center;

  flex: none;
}


.selected .radio {
  border-color: var(--accent);
}


.selected .radio::after {
  content: "";

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: var(--accent);
}


.result {
  text-align: center;

  padding: 25px 0;
}


.check {
  font-size: 60px;

  margin-bottom: 15px;
}


.score {
  font-size: 42px;

  font-weight: 800;

  margin: 15px 0;
}


.small {
  font-size: 13px;

  color: var(--muted);
}


.google-box {
  margin-top: 25px;

  padding: 20px;

  background: #fafaff;

  border:
    1px solid var(--line);

  border-radius: 18px;
}


.google-status {
  margin-top: 12px;

  font-size: 14px;

  color: var(--muted);
}


.user-box {
  margin-top: 15px;

  padding: 12px 15px;

  background: #f4f4ff;

  border-radius: 12px;

  font-size: 14px;
}


.error {
  color: var(--bad);

  font-size: 14px;

  margin-top: 10px;
}


@media (max-width: 700px) {

  .app {
    padding: 12px;
  }


  .shell {
    border-radius: 20px;
  }


  header {
    padding:
      22px 22px 16px;
  }


  main {
    padding:
      30px 22px 36px;
  }


  .categories {
    grid-template-columns: 1fr;
  }


  .category {
    min-height: auto;
  }


  .actions {
    margin-top: 25px;
  }

}

</style>

</head>


<body>


<div class="app">

  <div class="shell">

    <header>

      <div class="brand">

        MD QUIZ

        <span
          style="
            color:#777;
            font-weight:500;
          "
        >
          / interactive quiz
        </span>

      </div>


      <div class="progress">

        <div
          class="bar"
          id="bar"
        ></div>

      </div>

    </header>


    <main id="main"></main>

  </div>

</div>



<script>


/* =========================================================
   GOOGLE / APPS SCRIPT SETTINGS
   ========================================================= */


const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwqiDLmoae0bq1ACGxI6t29PwLAbWJxwssX7Bt_aD1DFi3EAPreMkYGg5LlG3BSOH-y/exec";


const GOOGLE_CLIENT_ID =
  "137181230859-7na7p5vt38snq92hcnqsdl5kh6b944so.apps.googleusercontent.com";



/* =========================================================
   QUIZ QUESTIONS
   ========================================================= */


const quizzes = {


  basic: {

    title: "Basic MD",

    icon: "⚛️",

    description:
      "Test your understanding of the foundations of molecular dynamics.",

    questions: [

      {
        q: "Why is a timestep of 1–2 fs commonly used in atomistic MD simulations?",

        image: "",

        options: [
          "To accurately resolve the fastest atomic motions",
          "Because proteins fold in a time steps of every 1–2 fs",
          "To keep the temperature constant",
          "Because the simulation box changes every 1–2 fs "
        ],

        correct: 0
      },


      {
        q: "How does the choice of NVT or NPT ensemble affect the calculation of free energy in molecular dynamics?",

        image: "",

        options: [
          "The ensemble has no effect on free energy calculations",
          "The appropriate free-energy definition depends on the thermodynamic ensemble and its controlled variables",
          "NPT simulations always give lower free energies than NVT simulations",
          "NVT simulations cannot be used for free-energy calculations "
        ],

        correct: 1
      },


      {
        q: "Which fundamental equation governs the motion of atoms in classical molecular dynamics?",

        image: "",

        options: [
          "Schrödinger equation",
          "Newton's second law",
          "Boltzmann equation",
          "Navier–Stokes equation "
        ],

        correct: 1
      },


      {
        q:
          "Which quantity does not change as a result of the time integration of an individual particle's motion?",

        image: "",

        options: [
          "Position",
          "Velocity",
          "Acceleration",
          "Mass "
        ],

        correct: 3
      },


      {
        q: "Why is NVT equilibration commonly performed before NPT equilibration?",

        image: "",

        options: [
          "To first stabilize the system's temperature before allowing the volume/density to adjust",
          "To increase the number of particles ",
          "To remove all kinetic energy from the system",
          "To eliminate the need for pressure coupling "
        ],

        correct: 0
      }

    ]

  },



  advanced: {

    title: "Advanced MD",

    icon: "🧬",

    description:
      "Go deeper into sampling, force fields, analysis and simulation methodology.",

    questions: [

      {
        q:
          "Why are periodic boundary conditions commonly used?",

        image: "",

        options: [
          "To approximate bulk behavior",
          "To remove all solvent",
          "To increase temperature",
          "To eliminate interactions"
        ],

        correct: 0
      },


      {
        q: "What does PME primarily handle?",

        image: "",

        options: [
          "Long-range electrostatics",
          "Protein secondary structure",
          "Trajectory compression",
          "Temperature scaling"
        ],

        correct: 0
      },


      {
        q: "What is the role of a thermostat?",

        image: "",

        options: [
          "Control or maintain temperature",
          "Calculate RDF directly",
          "Build a topology",
          "Remove periodicity"
        ],

        correct: 0
      },


      {
        q: "What can an RDF, g(r), describe?",

        image: "",

        options: [
          "Spatial distribution of particles around a reference",
          "Protein sequence identity",
          "Simulation wall time",
          "GPU memory usage"
        ],

        correct: 0
      },


      {
        q:
          "Why are equilibration and production runs separated?",

        image: "",

        options: [
          "To allow the system to relax before collecting production data",
          "To change the force field automatically",
          "To remove all water",
          "To increase atom count"
        ],

        correct: 0
      }

    ]

  },



  enhanced: {

    title: "Enhanced Sampling",

    icon: "🌀",

    description:
      "Challenge yourself with methods designed to explore difficult free-energy landscapes.",

    questions: [

      {
        q:
          "What is the main motivation for enhanced sampling?",

        image: "",

        options: [
          "Improve exploration of rare or slow events",
          "Reduce the number of atoms",
          "Remove all thermal motion",
          "Avoid defining a force field"
        ],

        correct: 0
      },


      {
        q:
          "What does umbrella sampling typically use?",

        image: "",

        options: [
          "A biasing potential across overlapping windows",
          "Only a vacuum simulation",
          "A single minimization",
          "Random atom deletion"
        ],

        correct: 0
      },


      {
        q: "What is WHAM used for?",

        image: "",

        options: [
          "Combining biased histograms to estimate an unbiased distribution",
          "Generating protein sequences",
          "Assigning atom names",
          "Visualizing molecules only"
        ],

        correct: 0
      },


      {
        q: "What does a PMF represent?",

        image: "",

        options: [
          "Free energy as a function of a coordinate",
          "Total number of water molecules",
          "Protein mass",
          "Simulation temperature only"
        ],

        correct: 0
      },


      {
        q: "What is a collective variable (CV)?",

        image: "",

        options: [
          "A reduced coordinate describing a process of interest",
          "A force-field atom type",
          "A GPU setting",
          "A trajectory file format"
        ],

        correct: 0
      }

    ]

  }

};



/* =========================================================
   APPLICATION STATE
   ========================================================= */


let state = {

  screen: "intro",

  name: "",

  email: "",

  googleCredential: "",

  googleSub: "",

  type: null,

  index: 0,

  answers: [],

  finalScore: 0

};



/* =========================================================
   GOOGLE SIGN-IN
   ========================================================= */


function handleGoogleCredential(response) {

  try {

    const credential =
      response.credential;


    state.googleCredential =
      credential;


    /*
     * Decode Google ID token payload
     * to display the user's email.
     *
     * The Apps Script backend performs
     * the actual verification.
     */


    const payload =
      JSON.parse(
        atob(
          credential
            .split(".")[1]
            .replace(/-/g, "+")
            .replace(/_/g, "/")
        )
      );


    state.email =
      payload.email || "";


    state.googleSub =
      payload.sub || "";


    render();


  } catch (error) {

    console.error(error);

    alert(
      "Google Sign-In could not be completed. Please try again."
    );

  }

}



function initializeGoogleSignIn() {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.id
  ) {

    setTimeout(
      initializeGoogleSignIn,
      500
    );

    return;

  }


  google.accounts.id.initialize({

    client_id:
      GOOGLE_CLIENT_ID,

    callback:
      handleGoogleCredential,

    auto_select:
      false,

    cancel_on_tap_outside:
      true

  });


  const button =
    document.getElementById(
      "googleButton"
    );


  if (button) {

    google.accounts.id.renderButton(

      button,

      {
        theme: "outline",

        size: "large",

        width: 300,

        text: "signin_with",

        shape: "rectangular"
      }

    );

  }

}



/* =========================================================
   RENDER
   ========================================================= */


function render() {

  if (
    state.screen === "intro"
  ) {

    renderIntro();

  }

  else if (
    state.screen === "category"
  ) {

    renderCategory();

  }

  else if (
    state.screen === "quiz"
  ) {

    renderQuiz();

  }

  else if (
    state.screen === "done"
  ) {

    renderDone();

  }

}



/* =========================================================
   INTRO
   ========================================================= */


function renderIntro() {

  document
    .getElementById("bar")
    .style.width = "0%";


  document
    .getElementById("main")
    .innerHTML = `

      <div class="screen">

        <div class="eyebrow">
          MOLECULAR DYNAMICS CHALLENGE
        </div>


        <h1>
          How well do you know
          molecular dynamics?
        </h1>


        <p>
          Enter your name and sign in with Google
          before starting the quiz.
        </p>


        <label>
          Your name *
        </label>


        <input
          id="nameInput"
          type="text"
          placeholder="e.g. Shiv"
          value="${escapeHtml(state.name)}"
        >


        <div class="google-box">

          <strong>
            Sign in with Google
          </strong>


          <p class="small">

            Your Google account is used to record
            your verified email address with your
            quiz response.

          </p>


          <div id="googleButton"></div>


          ${
            state.email

            ?

            `
              <div class="user-box">

                ✓ Signed in as

                <strong>
                  ${escapeHtml(state.email)}
                </strong>

              </div>
            `

            :

            `
              <div class="google-status">
                Please sign in with Google to continue.
              </div>
            `
          }

        </div>


        <div id="introError"></div>


        <div class="actions">

          <div></div>


          <button
            class="primary"
            onclick="startQuiz()"
          >
            Continue →
          </button>

        </div>

      </div>

    `;


  initializeGoogleSignIn();

}



/* =========================================================
   START QUIZ
   ========================================================= */


function startQuiz() {

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim();


  const error =
    document.getElementById(
      "introError"
    );


  if (!name) {

    error.innerHTML = `
      <div class="error">
        Please enter your name.
      </div>
    `;

    return;

  }


  if (!state.email) {

    error.innerHTML = `
      <div class="error">
        Please sign in with Google before continuing.
      </div>
    `;

    return;

  }


  state.name =
    name;


  state.screen =
    "category";


  render();

}



/* =========================================================
   CATEGORY
   ========================================================= */


function renderCategory() {

  document
    .getElementById("bar")
    .style.width = "5%";


  document
    .getElementById("main")
    .innerHTML = `

      <div class="screen">

        <div class="eyebrow">
          STEP 1
        </div>


        <h2>
          Choose your challenge
        </h2>


        <p>
          Select one category.
          Each category contains five questions.
        </p>


        <div class="categories">

          ${

            Object.entries(quizzes)

              .map(
                ([key, quiz]) => `

                  <div
                    class="category"
                    onclick="chooseCategory('${key}')"
                  >

                    <div class="icon">
                      ${quiz.icon}
                    </div>


                    <h3>
                      ${quiz.title}
                    </h3>


                    <p>
                      ${quiz.description}
                    </p>

                  </div>

                `
              )

              .join("")

          }

        </div>

      </div>

    `;

}



/* =========================================================
   CHOOSE CATEGORY
   ========================================================= */


function chooseCategory(type) {

  state.type =
    type;

  state.index =
    0;

  state.answers =
    [];

  state.screen =
    "quiz";

  render();

}



/* =========================================================
   QUIZ
   ========================================================= */


function renderQuiz() {

  const quiz =
    quizzes[state.type];


  const question =
    quiz.questions[state.index];


  const total =
    quiz.questions.length;


  const progress =
    (
      (state.index + 1)
      /
      total
    ) * 100;


  document
    .getElementById("bar")
    .style.width =
      progress + "%";


  const selected =
    state.answers[state.index];


  document
    .getElementById("main")
    .innerHTML = `

      <div class="screen">

        <div class="eyebrow">
          ${quiz.title}
        </div>


        <h2>
          Question
          ${state.index + 1}
          of
          ${total}
        </h2>


        <p>
          ${escapeHtml(question.q)}
        </p>


        ${
          question.image

          ?

          `
            <img
              class="q-image"
              src="${escapeHtml(question.image)}"
              alt="Question image"
            >
          `

          :

          ""
        }


        <div class="options">

          ${

            question.options

              .map(
                (option, i) => `

                  <div
                    class="
                      option
                      ${
                        selected === i
                          ? "selected"
                          : ""
                      }
                    "
                    onclick="answerQuestion(${i})"
                  >

                    <div class="radio"></div>

                    <div>
                      ${escapeHtml(option)}
                    </div>

                  </div>

                `
              )

              .join("")

          }

        </div>


        <div class="actions">

          <button
            class="secondary"
            onclick="previousQuestion()"
            ${
              state.index === 0
                ? "disabled"
                : ""
            }
          >
            ← Back
          </button>


          <button
            class="primary"
            onclick="nextQuestion()"
          >

            ${
              state.index === total - 1
                ? "Finish Quiz"
                : "Next →"
            }

          </button>

        </div>

      </div>

    `;

}



/* =========================================================
   ANSWER
   ========================================================= */


function answerQuestion(index) {

  state.answers[state.index] =
    index;

  render();

}



/* =========================================================
   NEXT
   ========================================================= */


function nextQuestion() {

  if (
    state.answers[state.index] ===
    undefined
  ) {

    alert(
      "Please select an answer."
    );

    return;

  }


  const quiz =
    quizzes[state.type];


  if (
    state.index <
    quiz.questions.length - 1
  ) {

    state.index++;

    render();

  }

  else {

    submitResults();

  }

}



/* =========================================================
   PREVIOUS
   ========================================================= */


function previousQuestion() {

  if (state.index > 0) {

    state.index--;

    render();

  }

}



/* =========================================================
   SUBMIT RESULTS
   ========================================================= */


function submitResults() {

  const quiz =
    quizzes[state.type];


  let score = 0;


  quiz.questions.forEach(
    (question, i) => {

      if (
        state.answers[i] ===
        question.correct
      ) {

        score++;

      }

    }
  );


  state.finalScore =
    score;


  /*
   * Prepare data for Apps Script.
   */

  const payload = {

    name:
      state.name,

    quiz:
      quiz.title,

    answers:
      state.answers,

    score:
      score,

    googleCredential:
      state.googleCredential,

    googleSub:
      state.googleSub

  };


  /*
   * Create hidden iframe.
   */

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.name =
    "googleSubmissionFrame";


  iframe.style.display =
    "none";


  document.body.appendChild(
    iframe
  );


  /*
   * Create normal HTML POST form.
   */

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    GOOGLE_SCRIPT_URL;


  form.target =
    "googleSubmissionFrame";


  form.style.display =
    "none";


  /*
   * Put JSON payload into form field.
   */

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "hidden";


  input.name =
    "payload";


  input.value =
    JSON.stringify(payload);


  form.appendChild(
    input
  );


  document.body.appendChild(
    form
  );


  /*
   * Send the form.
   */

  form.submit();


  /*
   * Give Apps Script time to receive it,
   * then show completion page.
   */

  setTimeout(
    () => {

      state.screen =
        "done";


      render();


      form.remove();


      iframe.remove();

    },
    1500
  );

}



/* =========================================================
   DONE
   ========================================================= */


function renderDone() {

  document
    .getElementById("bar")
    .style.width =
      "100%";


  const quiz =
    quizzes[state.type];


  document
    .getElementById("main")
    .innerHTML = `

      <div class="screen result">

        <div class="check">
          ✓
        </div>


        <div class="eyebrow">
          QUIZ COMPLETE
        </div>


        <h2>
          Thank you,
          ${escapeHtml(state.name)}!
        </h2>


        <div class="score">

          ${state.finalScore}
          /
          ${quiz.questions.length}

        </div>


        <p>
          Your response has been submitted.
        </p>


        <p class="small">

          Signed in as
          ${escapeHtml(state.email)}

        </p>


        <div class="actions">

          <div></div>


          <button
            class="primary"
            onclick="resetQuiz()"
          >
            Take Another Quiz
          </button>

        </div>

      </div>

    `;

}



/* =========================================================
   RESET
   ========================================================= */


function resetQuiz() {

  state = {

    screen: "intro",

    name: "",

    email: "",

    googleCredential: "",

    googleSub: "",

    type: null,

    index: 0,

    answers: [],

    finalScore: 0

  };


  render();

}



/* =========================================================
   HTML ESCAPING
   ========================================================= */


function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================================
   START
   ========================================================= */


render();

</script>
